name: Validate documentation portal

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out portal repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install documentation dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Collect source documentation
        run: python scripts/collect_docs.py

      - name: Generate glossary abbreviations
        run: python scripts/generate_glossary_abbreviations.py

      - name: Generate portal pages and MkDocs configuration
        run: |
          python scripts/generate_index.py
          python scripts/generate_mkdocs_config.py

      - name: Build MkDocs site
        run: python -m mkdocs build

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: documentation-preview
          path: site/
          retention-days: 7
