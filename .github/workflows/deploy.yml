name: Build and deploy documentation portal

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out portal repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-zensical.txt

      - name: Install Zensical dependencies
        run: python -m pip install --requirement requirements-zensical.txt

      - name: Collect source documentation
        run: python scripts/collect_docs.py

      - name: Generate glossary abbreviations
        run: python scripts/generate_glossary_abbreviations.py

      - name: Generate portal pages and Zensical configuration
        run: |
          python scripts/generate_index.py
          python scripts/generate_mkdocs_config.py --template config/zensical_template.yml --output zensical.yml --builder-name Zensical

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build Zensical site
        run: zensical build --config-file zensical.yml

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site-zensical/

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
